<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Upload ID Card Photo - Valley Security Service Agency</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VSA Portal">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.321.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-canvas: #080c14;
      --bg-surface: rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --brand-primary: #6366f1;
      --brand-primary-hover: #4f46e5;
      --brand-gold: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.15), transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 110%, rgba(245, 158, 11, 0.08), transparent 70%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      text-align: center;
      animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 50px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.28);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px; 
      font-weight: 800; 
      color: #ffffff; 
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    p.subtitle { 
      font-size: 13px; 
      color: var(--text-muted); 
      margin-bottom: 24px; 
      line-height: 1.5; 
    }
    
    .emp-card {
      background: rgba(3, 7, 18, 0.5);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 24px;
      text-align: left;
    }

    .emp-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      font-size: 13px; 
      margin-bottom: 8px; 
    }

    .emp-row:last-child {
      margin-bottom: 0;
    }

    .emp-label { 
      color: var(--text-muted); 
      font-weight: 600; 
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .emp-val { 
      color: var(--text-primary); 
      font-weight: 700; 
      text-align: right; 
    }

    .photo-preview-box {
      width: 170px;
      height: 210px;
      margin: 0 auto 24px;
      border-radius: 18px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      background: rgba(3, 7, 18, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .photo-preview-box:hover {
      border-color: var(--brand-primary);
      background: rgba(99, 102, 241, 0.05);
      transform: translateY(-2px);
    }

    .photo-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-preview-box .upload-icon {
      margin-bottom: 10px;
      color: var(--brand-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-preview-box p { 
      font-size: 12px; 
      color: var(--text-muted); 
      font-weight: 600;
      padding: 0 10px;
      line-height: 1.4;
    }

    input[type="file"] { 
      display: none; 
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 13px 20px;
      border-radius: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-hover) 100%);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:disabled { 
      opacity: 0.55; 
      cursor: not-allowed; 
      transform: none !important;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover { 
      background: rgba(255, 255, 255, 0.12); 
      border-color: rgba(255, 255, 255, 0.2);
    }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
      text-align: left;
    }

    .msg-error { 
      background: rgba(239, 68, 68, 0.12); 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      color: #fca5a5; 
    }

    .msg-success { 
      background: rgba(34, 197, 94, 0.12); 
      border: 1px solid rgba(34, 197, 94, 0.3); 
      color: #86efac; 
    }

    .footer-note { 
      font-size: 11px; 
      color: #64748b; 
      margin-top: 20px; 
    }

    button, a, input, .photo-preview-box {
      touch-action: manipulation;
    }

    @media (max-width: 480px) {
      body {
        padding: max(20px, env(safe-area-inset-top, 20px)) max(12px, env(safe-area-inset-right, 12px)) max(20px, env(safe-area-inset-bottom, 20px)) max(12px, env(safe-area-inset-left, 12px));
      }

      .container {
        padding: 28px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 20px;
      }
    }

    :focus-visible {
      outline: 2px solid var(--border-focus, #6366f1) !important;
      outline-offset: 2px !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <main class="container" role="main">
    <div class="brand-badge">
      <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i>
      Valley Security Service Agency
    </div>
    <h1>Upload ID Card Photo</h1>
    <p class="subtitle">Please upload a clear, front-facing passport portrait for your official security identity card.</p>

    <div id="msgBox" class="msg"></div>

    <div id="empDetails" class="emp-card" style="display:none;">
      <div class="emp-row"><span class="emp-label">Employee ID:</span><span id="dispId" class="emp-val"></span></div>
      <div class="emp-row"><span class="emp-label">Full Name:</span><span id="dispName" class="emp-val"></span></div>
      <div class="emp-row"><span class="emp-label">Department:</span><span id="dispDept" class="emp-val"></span></div>
    </div>

    <div class="photo-preview-box" onclick="document.getElementById('photoInput').click()" title="Click to choose or capture photo">
      <div id="placeholderUi">
        <div class="upload-icon">
          <i data-lucide="camera" style="width: 36px; height: 36px; stroke-width: 1.5;"></i>
        </div>
        <p>Tap to Select or Take Photo</p>
      </div>
      <img id="previewImg" alt="Selected Photo Preview">
    </div>

    <input type="file" id="photoInput" accept="image/*" capture="user" onchange="handleFileSelect(event)">

    <button id="chooseBtn" class="btn btn-secondary" onclick="document.getElementById('photoInput').click()">
      <i data-lucide="folder-up" style="width: 16px; height: 16px;"></i>
      Choose Photo / Take Picture
    </button>
    <button id="uploadBtn" class="btn btn-primary" style="display:none;" onclick="submitPhoto()">
      <i data-lucide="check" style="width: 16px; height: 16px;"></i>
      Upload & Save Photo
    </button>

    <div class="footer-note">Supported formats: JPG, PNG • Maximum size: 10 MB</div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const empId = urlParams.get('id');
    const token = urlParams.get('token');
    let selectedBase64 = null;

    function showMsg(text, isError = false) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = 'msg ' + (isError ? 'msg-error' : 'msg-success');
      box.style.display = 'block';
    }

    async function init() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }

      if (!empId || !token) {
        showMsg('Invalid or missing upload link. Please request a new link from office administration.', true);
        document.getElementById('chooseBtn').style.display = 'none';
        return;
      }

      try {
        const res = await fetch(`/api/get-employee-by-token?id=${encodeURIComponent(empId)}&token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (data.success) {
          document.getElementById('dispId').textContent = data.id;
          document.getElementById('dispName').textContent = data.name;
          document.getElementById('dispDept').textContent = data.department || 'General Duty';
          document.getElementById('empDetails').style.display = 'block';

          if (data.photo) {
            document.getElementById('previewImg').src = data.photo;
            document.getElementById('previewImg').style.display = 'block';
            document.getElementById('placeholderUi').style.display = 'none';
          }
        } else {
          showMsg(data.error || 'Employee record not found.', true);
          document.getElementById('chooseBtn').style.display = 'none';
        }
      } catch (err) {
        showMsg('Network error connecting to security server.', true);
      }
    }

    function handleFileSelect(evt) {
      const file = evt.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showMsg('Please select a valid image file.', true);
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64 = e.target.result;
        document.getElementById('previewImg').src = selectedBase64;
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('placeholderUi').style.display = 'none';
        document.getElementById('uploadBtn').style.display = 'flex';
        showMsg('Photo selected! Tap "Upload & Save Photo" below to submit.');
      };
      reader.readAsDataURL(file);
    }

    async function submitPhoto() {
      if (!selectedBase64) {
        showMsg('Please select a photo first.', true);
        return;
      }

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.textContent = 'Saving photo...';

      try {
        const res = await fetch('/api/upload-photo-by-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            employeeId: empId,
            token: token,
            photoBase64: selectedBase64
          })
        });
        const data = await res.json();
        if (data.success) {
          showMsg('✅ Photo saved successfully! Your official ID card is updated.');
          btn.style.display = 'none';
          document.getElementById('chooseBtn').innerHTML = '<i data-lucide="check" style="width: 16px; height: 16px;"></i> Change Photo';
          if (typeof lucide !== 'undefined') lucide.createIcons();
        } else {
          showMsg(data.error || 'Failed to save photo. Try again.', true);
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="check" style="width: 16px; height: 16px;"></i> Upload & Save Photo';
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
      } catch (err) {
        showMsg('Error uploading photo to server.', true);
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check" style="width: 16px; height: 16px;"></i> Upload & Save Photo';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
