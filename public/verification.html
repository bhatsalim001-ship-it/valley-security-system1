<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title id="verify-page-title">Employee Verification Portal - Valley Security</title>
    <meta name="description" content="Official Employee Verification Portal of Valley Security Service Agency. Verify security guard credentials and active status instantly via QR code.">
    <meta name="keywords" content="Valley Security, Valley Security Service Agency, Security Guard, Verification Portal, QR Code Verify, Active Guards">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#080c14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VSA Portal">
    <link rel="apple-touch-icon" href="/favicon.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://valleysecurityserviceagency.in/verification.html">
    <meta property="og:title" content="Employee Verification Portal">
    <meta property="og:description" content="Official Employee Verification Portal of Valley Security Service Agency. Verify security guard credentials and active status instantly via QR code.">
    <meta property="og:image" content="https://valleysecurityserviceagency.in/favicon.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://valleysecurityserviceagency.in/verification.html">
    <meta property="twitter:title" content="Employee Verification Portal">
    <meta property="twitter:description" content="Official Employee Verification Portal of Valley Security Service Agency. Verify security guard credentials and active status instantly via QR code.">
    <meta property="twitter:image" content="https://valleysecurityserviceagency.in/favicon.png">

    <!-- ⚙️ FIRM CONFIG — load FIRST -->
    <script src="firm-config.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.321.0/dist/umd/lucide.min.js"></script>
    <!-- QRious QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --bg-canvas: #080c14;
            --bg-surface: rgba(15, 23, 42, 0.82);
            --bg-surface-elevated: rgba(30, 41, 59, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: #10b981;
            --brand-primary: #10b981;
            --theme-gold: #f59e0b;
            --theme-green: #10b981;
            --theme-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(16, 185, 129, 0.12), transparent 70%),
                radial-gradient(ellipse 60% 50% at 50% 110%, rgba(99, 102, 241, 0.08), transparent 70%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .verify-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 
                0 25px 60px -15px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 36px 30px;
            position: relative;
            z-index: 2;
            text-align: center;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .agency-brand {
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            color: var(--theme-green);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
        }

        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 1.2px;
            line-height: 1.2;
            color: #ffffff;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
            display: block;
        }

        /* Status Banner Badge */
        .status-badge-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .verification-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-verified {
            background: rgba(16, 185, 129, 0.14);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.35);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        .status-suspended {
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
        }

        .status-notfound {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-secondary);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        /* Guard Profile Card info */
        .guard-avatar-frame {
            width: 130px;
            height: 160px;
            margin: 0 auto 18px auto;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 3px;
            background: rgba(3, 7, 18, 0.7);
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s;
        }

        .guard-avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .guard-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .guard-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--theme-gold);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 20px;
        }

        /* Countdown Section */
        #countdown-container {
            margin: 20px 0;
            padding: 16px;
            background: rgba(3, 7, 18, 0.6);
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
        }

        .countdown-timer-display {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .time-unit {
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            min-width: 54px;
        }

        .time-unit span:first-child {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--theme-gold);
            display: block;
            line-height: 1.1;
        }

        .time-unit span:last-child {
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 3px;
            display: block;
        }

        .info-grid {
            border-top: 1px solid var(--border-subtle);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-weight: 700;
            color: var(--text-primary);
            text-align: right;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 16px;
            margin-top: 20px;
            line-height: 1.5;
        }

        .footer-note strong {
            color: var(--theme-gold);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Error States styling */
        .error-message {
            padding: 36px 0;
            text-align: center;
        }

        .error-icon {
            color: var(--theme-red);
            margin-bottom: 16px;
            display: inline-block;
        }

        .error-message h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .placeholder-message {
            padding: 40px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        button, a, input {
            touch-action: manipulation;
        }

        @media (max-width: 480px) {
            body {
                padding: max(16px, env(safe-area-inset-top, 16px)) max(12px, env(safe-area-inset-right, 12px)) max(16px, env(safe-area-inset-bottom, 16px)) max(12px, env(safe-area-inset-left, 12px));
            }

            .verify-container {
                padding: 28px 20px;
                border-radius: 20px;
            }

            .brand-title {
                font-size: 20px;
            }

            .countdown-timer-display {
                gap: 6px;
            }

            .time-unit {
                min-width: 46px;
                padding: 6px 8px;
            }
        }

        :focus-visible {
            outline: 2px solid var(--theme-green, #10b981) !important;
            outline-offset: 2px !important;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="verify-container" role="main">
        <!-- Brand -->
        <div class="agency-brand">
            <div class="brand-logo">
                <i data-lucide="shield-check" style="width: 30px; height: 30px;"></i>
            </div>
            <h1 class="brand-title" id="verify-firm-title">VALLEY SECURITY</h1>
            <span class="brand-subtitle">Official Identity Verification Service</span>
        </div>

        <div id="portal-content">
            <!-- Dynamic Content goes here -->
            <div class="placeholder-message">
                <i data-lucide="loader" class="animate-spin" style="width: 24px; height: 24px; margin-bottom: 12px; display: inline-block;"></i>
                <p>Loading employee credentials from central security node...</p>
            </div>
        </div>

        <div class="footer-note">
            Licence No: <strong id="verify-license-no">PSA | L | 99 | JK |2024 | DEC | 3| 62</strong><br>
            <p id="verify-footer-address" style="margin-top: 6px;">Valley Security Service Agency Head Office: SHAHEED GUNJ NATH COMPLEX SRINAGAR 190001</p>
        </div>
    </main>

    <script>
        // Apply FIRM_CONFIG on verification page
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            if (typeof FIRM_CONFIG !== 'undefined') {
                const C = FIRM_CONFIG;
                const t = document.getElementById('verify-page-title');
                if (t) t.innerText = 'Employee Verification - ' + C.name;
                const title = document.getElementById('verify-firm-title');
                if (title) title.innerText = C.nameShort;
                const licNo = document.getElementById('verify-license-no');
                if (licNo) licNo.innerText = C.licenseNo;
                const addr = document.getElementById('verify-footer-address');
                if (addr) addr.innerText = C.name + ' Head Office: ' + C.address;
            }
            verifyEmployee();
        });

        async function verifyEmployee() {
            const contentDiv = document.getElementById('portal-content');
            
            // Extract employee ID from URL queries
            const urlParams = new URLSearchParams(window.location.search);
            const empId = urlParams.get('id');
            const token = urlParams.get('token') || '';

            if (!empId) {
                renderError(contentDiv, "Invalid Verification Query", "No employee identification parameter was provided. Please check the scan URL details.");
                return;
            }

            try {
                // Fetch details for this specific guard from the public lookup API
                const response = await fetch('/api/employees/' + encodeURIComponent(empId) + '?token=' + encodeURIComponent(token));
                if (response.status === 401) {
                    renderError(contentDiv, "Unauthorized Access", "The verification link signature is invalid. Scanning the official QR code on the physical ID card is required to view these credentials.");
                    return;
                }
                if (response.status === 404) {
                    renderError(contentDiv, "Guardsman Profile Record Missing", `No registered personnel fits the identity key <strong>${escapeHtml(empId)}</strong> in our active database.`);
                    return;
                }
                if (!response.ok) throw new Error("Verification network node unreachable.");
                
                const guard = await response.json();

                // Render success status card details
                renderGuardDetails(contentDiv, guard);
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            } catch (err) {
                console.error(err);
                renderError(contentDiv, "Network Connection Failure", "Unable to establish contact with the Valley Security Agency Local Cloud. Verify server status.");
            }
        }

        function getFallbackAvatar(initial) {
            const safeInitial = escapeHtml(String(initial || '?').slice(0, 1).toUpperCase());
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='100' height='120' viewBox='0 0 100 120'><defs><linearGradient id='avatarGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%236366f1'/><stop offset='100%' stop-color='%230f172a'/></linearGradient></defs><rect width='100%' height='100%' fill='url(%23avatarGrad)'/><text x='50%' y='55%' font-family='sans-serif' font-weight='bold' font-size='32' fill='%23ffffff' text-anchor='middle'>${safeInitial}</text></svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        function sanitizeImageUrl(url, fallback) {
            if (typeof url === 'string' && (/^\/api\/employees\/[^"'\s]+\/(photo|signature)(\?token=[A-Za-z0-9_-]+)?$/.test(url) || /^data:image\/(png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+$/.test(url))) {
                return url;
            }
            return fallback;
        }

        function renderGuardDetails(container, guard) {
            const isActive = guard.status === 'Active';
            const statusClass = isActive ? 'status-verified' : 'status-suspended';
            const statusText = isActive ? 'Active Guard (Verified)' : `${guard.status || ''} Personnel`;
            const statusIcon = isActive ? 'check-circle-2' : 'alert-octagon';

            const fallbackAvatar = getFallbackAvatar(guard.name ? guard.name[0].toUpperCase() : '?');
            const photoUrl = sanitizeImageUrl(guard.documents?.photo || guard.photo, fallbackAvatar);

            container.innerHTML = `
                <div class="status-badge-container">
                    <span class="verification-status ${statusClass}">
                        <i data-lucide="${statusIcon}" style="width: 16px; height: 16px;"></i>
                        ${escapeHtml(statusText)}
                    </span>
                </div>

                <div class="guard-avatar-frame">
                    <img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(guard.name || 'Guard Profile')}">
                </div>

                <h3 class="guard-name">${escapeHtml(guard.name)}</h3>
                <p class="guard-title">${escapeHtml(guard.designation)}</p>

                <!-- Countdown Section -->
                <div id="countdown-container">
                    <!-- Loaded dynamically via ticker -->
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Employee ID</span>
                        <span class="info-value" style="font-family: 'JetBrains Mono', monospace;">${escapeHtml(guard.id)}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Department</span>
                        <span class="info-value" style="color: var(--brand-primary); font-weight: 700;">${escapeHtml(guard.department || "-")}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Designation</span>
                        <span class="info-value">${escapeHtml(guard.designation || "-")}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">${escapeHtml(guard.relationType || "Father")}'s Name</span>
                        <span class="info-value">${escapeHtml(guard.fatherName || "-")}</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Blood Group</span>
                        <span class="info-value">${escapeHtml(guard.bloodGroup || "-")}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Joining Date</span>
                        <span class="info-value">${escapeHtml(guard.joiningDate || "-")}</span>
                    </div>
                </div>
            `;

            // Setup real-time ticking validity countdown
            if (window.countdownTimer) clearInterval(window.countdownTimer);

            const countdownContainer = document.getElementById('countdown-container');

            if (!isActive) {
                if (countdownContainer) {
                    let alertColor = 'var(--theme-red)';
                    let message = 'ACCESS REVOKED / INACTIVE';
                    if (guard.status === 'Fired') {
                        message = 'ACCESS REVOKED - FIRED';
                    } else if (guard.status === 'Left') {
                        message = 'INACTIVE - LEFT SERVICE';
                        alertColor = 'var(--text-muted)';
                    } else if (guard.status === 'Suspended') {
                        message = 'ACCESS SUSPENDED';
                    }
                    countdownContainer.innerHTML = `
                        <div style="color: ${alertColor}; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px;">
                            <i data-lucide="shield-off" style="display: inline-block; vertical-align: middle; width: 18px; height: 18px; margin-right: 4px;"></i>
                            ${escapeHtml(message)}
                        </div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                            This ID card is no longer valid for duty.
                        </div>
                    `;
                }
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            // Use cardIssueDate if set, otherwise fall back to joiningDate, then today
            const issueDateSrc = guard.cardIssueDate || guard.joiningDate || new Date().toISOString();
            const joinDate = new Date(issueDateSrc);
            const validityYears = guard.cardValidity || 3;
            const expDate = new Date(joinDate);
            expDate.setFullYear(joinDate.getFullYear() + validityYears);

            function updateCountdown() {
                const now = new Date();
                const timeDiff = expDate - now;
                const countdownContainer = document.getElementById('countdown-container');
                const statusBadge = document.querySelector('.verification-status');

                if (timeDiff <= 0) {
                    clearInterval(window.countdownTimer);
                    if (countdownContainer) {
                        countdownContainer.innerHTML = `
                            <div style="color: var(--theme-red); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
                                <i data-lucide="shield-alert" style="display: inline-block; vertical-align: middle; width: 16px; height: 16px; margin-right: 4px;"></i>
                                Card Expired
                            </div>
                            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                                Validity ended on ${expDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' })}
                            </div>
                        `;
                    }
                    if (statusBadge) {
                        statusBadge.className = 'verification-status status-suspended';
                        statusBadge.innerHTML = `<i data-lucide="alert-octagon" style="width: 16px; height: 16px;"></i> CARD EXPIRED`;
                    }
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

                if (countdownContainer) {
                    countdownContainer.innerHTML = `
                        <div style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700;">Card Validity Countdown</div>
                        <div class="countdown-timer-display">
                            <div class="time-unit">
                                <span>${days}</span>
                                <span>Days</span>
                            </div>
                            <div class="time-unit">
                                <span>${hours}</span>
                                <span>Hrs</span>
                            </div>
                            <div class="time-unit">
                                <span>${minutes}</span>
                                <span>Mins</span>
                            </div>
                            <div class="time-unit">
                                <span>${seconds}</span>
                                <span>Secs</span>
                            </div>
                        </div>
                    `;
                }
            }

            updateCountdown();
            window.countdownTimer = setInterval(updateCountdown, 1000);
        }

        function renderError(container, heading, details) {
            container.innerHTML = `
                <div class="error-message">
                    <i data-lucide="shield-alert" class="error-icon" style="width: 44px; height: 44px;"></i>
                    <h3>${escapeHtml(heading)}</h3>
                    <p style="font-size: 13px; line-height: 1.5; color: var(--text-muted); margin-top: 10px;">${escapeHtml(details)}</p>
                </div>
            `;
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
            });
        }
    </script>
</body>
</html>
