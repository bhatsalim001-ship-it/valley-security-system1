services:
  - type: web
    name: valley-security-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: KILL_SWITCH_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
